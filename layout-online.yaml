# layout.yaml -- Grid-based article placement

grid:
  rows: 24
  columns: 6
  gutter: 8pt
  text_gutter: 8pt

articles:
  - slug: banks
    column_width: 3
    full_width_header: true
    placements:
      - page: 1
        cells:
          - [[0, 0], [9, 5]]

  - slug: icpc
    column_width: 2
    full_width_header: true
    images:
      - src: icpc.jpg
        scale: 70
    placements:
      - page: 1
        cells:
          - [[10, 0], [23, 1]]

  - slug: robotics
    column_width: 2
    full_width_header: true
    images:
      - src: SIGRobotics_Seeed_Team.jpg
        caption: "Left to right: Stephen Zhu, Hasan Al Saeedi, Keshav Badrinath, Filip Kujuwa, Himank Handa, Sanjit Kumar, Aarsh Mittal, Leo Lin"
        scale: 90
      - src: SIGRobotics_CalHacks_Team.jpeg
        caption: "Left to right: Yash Yardi, William Po-Yen Chou, Tanish Mittal, Krish Konda"
        scale: 90
    placements:
      - page: 2
        cells:
          - [[0, 0], [10, 5]]
      - page: 1
        cells:
          - [[10, 2], [23, 3]]

  - slug: rparticle
    column_width: 2
    full_width_header: true
    images:
      - src: driving_innovation_showcase.jpg
        caption: "Driving Innovation Showcase"
      - src: career_fair.jpg
        caption: "Career Fair"
      - src: full_staff.png
        caption: "Full Staff"
    placements:
      - page: 1
        cells:
          - [[10, 4], [23, 5]]
      - page: 3
        cells:
          - [[0, 0], [16, 5]]

  - slug: qiskitfallfest
    column_width: 2
    full_width_header: true
    placements:
      - page: 2
        cells:
          - [[11, 0], [23, 5]]
        images:
          - src: QiskitFallFest.png
            mode: grid
            cells:
              - [[20, 4], [23, 5]]
            y-alignment: left

  - slug: siggraph
    column_width: 2
    full_width_header: true
    placements:
      - page: 4
        cells:
          - [[16, 0], [23, 3]]

  - slug: sigecom
    column_width: 3
    full_width_header: true
    placements:
      - page: 3
        cells:
          - [[17, 0], [23, 5]]

  - slug: gamebuilders
    column_width: 2
    full_width_header: true
    placements:
      - page: 4
        cells:
          - [[16, 4], [23, 5]]

  - slug: sigplan
    column_width: 2
    full_width_header: true
    images:
      - src: sigplan.png
    placements:
      - page: 4
        cells:
          - [[0, 0], [15, 5]]

  - slug: signll
    column_width: 2
    full_width_header: true
    placements:
      - page: 5
        cells:
          - [[0, 0], [10, 5]]

